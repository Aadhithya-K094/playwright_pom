export default "<ion-content>\r\n\r\n  <ion-row class=\"header-image\">\r\n    <ion-col size=\"12\">\r\n      <ion-row>\r\n        <ion-col size=\"3\" style=\"font-size: x-large;\">\r\n          <ion-icon style=\"margin-top: 2%;\" name=\"arrow-back\" (click)=\"navigateBack()\">\r\n          </ion-icon>\r\n        </ion-col>\r\n        <ion-col size=\"9\" style=\"padding-left:5%;font-size: large;color: white;\">\r\n          {{name}}\r\n        </ion-col>\r\n      </ion-row>\r\n\r\n      <div>\r\n        <ion-row *ngFor=\"let item of menuarray\">\r\n          <ion-col size=\"4\" style=\"text-align: end;margin-bottom: 3%;\">\r\n            <img src={{item.icon}} />\r\n          </ion-col>\r\n          <ion-col size=\"8\" style=\"text-align:start;color: white;align-self: center;\r\n        margin-bottom: 3%;\" (click)=\"viewFile(item.pdf)\">\r\n            {{item.name}}\r\n          </ion-col>\r\n        </ion-row>\r\n      </div>\r\n\r\n    </ion-col>\r\n\r\n  </ion-row>\r\n\r\n</ion-content>";
