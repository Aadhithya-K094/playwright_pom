export default "<ion-header>\r\n  <ion-toolbar>\r\n    <ion-buttons slot=\"start\" class=\"pt-10\">\r\n      <ion-icon class=\"back-icon\" size=\"large\" name=\"arrow-back\" (click)=\"navigateBack()\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n    <ion-title class=\"pt-15\">Menu</ion-title>\r\n    <!-- <ion-buttons slot=\"end\" class=\"pt-10\">\r\n      <ion-icon class=\"back-icon\" size=\"large\" name=\"sync\" (click)=\"onSync()\">\r\n      </ion-icon>\r\n    </ion-buttons> -->\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content>\r\n  <ion-card class=\"card-align ion-card-margin\">\r\n    <div class=\"cards\" *ngFor=\"let menuItem of phase2MenuList;let i = index\">\r\n      <!-- {{mode}} : mode {{menuItem.value}} : menuItem -->\r\n    <ion-card class=\"card-design ion-card-margin-top-bottom\" (click)=\"navigateTo(menuItem.value)\" [ngStyle]=\"{'background': menuItem.value == '1' ? 'var(--seconday-color-change)' : '#E9E9E9'}\" >\r\n          <div class=\"card-text\">\r\n            <ion-label class=\"schoolnames\" [ngStyle]=\"{'background': menuItem.value == '1' ? 'var(--seconday-color-change)' : '#E9E9E9', 'color': (mode == 'DarkMode' && menuItem.value != '1') ? '#4c4a4a' : (mode == 'DarkMode' && menuItem.value == '1') ? 'var(--primary-text-color)' : '#4c4a4a'}\">{{menuItem.label}} </ion-label>\r\n          </div>\r\n          <div class=\"image-outer\">\r\n            <img class=\"img\" src={{menuItem.img}} /> \r\n          </div>\r\n        </ion-card>\r\n\r\n        <!-- <ion-card class=\"card-design ion-card-margin-top-bottom\" style=\"background-color: #E9E9E9\">\r\n          <div class=\"card-text\">\r\n            <ion-label class=\"schoolnames\">Annual Evalution</ion-label>\r\n          </div>\r\n          <div class=\"image-outer\">\r\n             <img class=\"img\" src=\"../../../../assets/icons/cwsn/Annual Evaluation-Grey.svg\" /> \r\n          </div>\r\n        </ion-card>\r\n\r\n        <ion-card class=\"card-design ion-card-margin-top-bottom\" style=\"background-color: #E9E9E9\">\r\n          <div class=\"card-text\">\r\n            <ion-label class=\"schoolnames\">Goal Setting for Next Academic Year </ion-label>\r\n          </div>\r\n          <div class=\"image-outer\">\r\n            <img class=\"img\" src=\"../../../../assets/icons/cwsn/Goal-Grey.svg\" /> \r\n          </div>\r\n        </ion-card> -->\r\n    </div>\r\n  </ion-card>\r\n</ion-content>\r\n";
