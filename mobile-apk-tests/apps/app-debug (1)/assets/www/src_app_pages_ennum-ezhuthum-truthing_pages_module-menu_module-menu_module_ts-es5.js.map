c}}\" />\r\n        <ion-label class=\"ion-text-center\">\r\n          {{data.name}}\r\n        </ion-label>\r\n      </ion-item>\r\n    </span> -->\r\n    <!-- <ion-item button detail routerLink=\"/tabs/assessment-report-menu\">\r\n      <img width=\"30\" src=\"/assets/images/ennum-ezhuthum/studentreportcard.png\" />\r\n      <ion-label class=\"ion-text-center\">\r\n        Assessment Reports\r\n      </ion-label>\r\n    </ion-item> -->\r\n  </ion-card>\r\n  <!-- <h5 style=\"text-align: center; margin-top: 100px;\">{{this.showMsg}}</h5> -->\r\n\r\n\r\n  <!-- <ion-col size=\"12\" class=\"ion-text-center\">\r\n    <div *ngIf=\"saving\" style=\"padding:5px;padding: 10px;\r\n    background: #c5c1c1;\">Saving...</div>\r\n    <div>\r\n      <ion-button *ngIf=\"remainguserdata > 0\" style=\"--background: #c34242;width: 90%;\r\n        margin: 20px\"\r\n        (click)=\"saveRemainingData();saveRemainingDataFormative();saveRemainingDataSummative();saveRemainingDataFormative_A()\">Data\r\n        Save Pending</ion-button>\r\n    </div>\r\n  </ion-col> -->\r\n</ion-content>";
