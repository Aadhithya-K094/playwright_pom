export default "<ion-content>\r\n  <ion-row>\r\n\r\n    <ion-col size=\"12\">\r\n      <ion-icon name=\"arrow-back\" style=\"margin-top: 3%;margin-left: 3%;margin-right: 2%;zoom: 1.3;\" (click)=\"navigateBack()\">  </ion-icon> <span style=\"margin-top: 3%;margin-left: 3%;margin-right: 2%;zoom: 1.3;\"> Experiments </span>\r\n    </ion-col>\r\n\r\n    <ion-col size=\"12\" style=\"padding: 5%;\">\r\n      <video controls width=\"100%\" height=\"210\" [id]=this.filename type=\"video/mp4\" controlsList=\"nodownload\">\r\n        <source [src]=this.vidUrl type=\"video/mp4\">\r\n      </video>\r\n    </ion-col>\r\n\r\n    <ion-col size=\"8\" style=\"padding: 5%;font-weight: bold;\">\r\n      {{name}}\r\n    </ion-col>\r\n\r\n    <ion-col size=\"4\" style=\"padding: 5%;zoom: 1.5;text-align: center;color: #6b4dc9;\">\r\n      <ion-icon name=\"download\" (click)=\"testVideoDownload()\"></ion-icon>\r\n    </ion-col>\r\n\r\n    <!-- <ion-col size=\"12\" style=\"padding: 5%;\">\r\n      <ion-row> \r\n\r\n        <ion-col size=\"4\" (click)=\"modal(1)\">\r\n          <ion-icon class=\"ion-ma\" src=\"/assets/images/awesome-star.svg\"></ion-icon><br>\r\n          <ion-label class=\"tab-label-text\">Rating</ion-label>\r\n         </ion-col>\r\n\r\n         <ion-col size=\"4\"  (click)=\"modal(2)\">\r\n          <ion-icon src=\"/assets/images/awesome-comments.svg\"></ion-icon><br>\r\n          <ion-label class=\"tab-label-text\">Comment</ion-label>\r\n         </ion-col>\r\n\r\n      </ion-row>\r\n    </ion-col> -->\r\n\r\n    <ion-col size=\"12\" style=\"padding: 5%;\">\r\n      <ion-row> \r\n        <ion-col size=\"6\" (click)=\"viewFile(this.tpdf)\">\r\n          <img src=\"/assets/images/video_tamil.png\" class=\"menuicon\">  \r\n        </ion-col>\r\n    \r\n        <ion-col size=\"6\" (click)=\"viewFile(this.epdf)\">\r\n          <img src=\"/assets/images/video_english.png\" class=\"menuicon\">   \r\n        </ion-col>\r\n      </ion-row>\r\n    </ion-col>\r\n \r\n  </ion-row>\r\n</ion-content>\r\n";
