export default "<ion-content>\r\n  <div class=\"modalcontent-wrapper notifications-wrapper\">\r\n    <ion-text color=\"\" class=\"ion-text-center pt-2\">\r\n      <p >\r\n        {{ this.notificationHeading }}\r\n      </p>\r\n    </ion-text>\r\n\r\n    <div class=\"d-flex justify-content-center n-footer\">\r\n      <ion-button\r\n        class=\"btn_modal-cancel\"\r\n        (click)=\"dismiss('Cancel')\"\r\n        [ngClass]=\"{\r\n          'ta-font': this.languageType === 'ta',\r\n          'fs-11': this.languageType === 'ta',\r\n          'modal-btn-w-50': this.languageType === 'ta'\r\n        }\"\r\n        >{{ this.cancel }}</ion-button\r\n      >\r\n    </div>\r\n  </div>\r\n</ion-content>\r\n";
