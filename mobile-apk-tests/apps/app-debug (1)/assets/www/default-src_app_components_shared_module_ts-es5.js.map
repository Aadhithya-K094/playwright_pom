export default "<ion-content>\r\n  <div class=\"modalcontent-wrapper\">\r\n    <ion-text color=\"\" class=\"ion-text-center pt-2\">\r\n      <p>\r\n        <span\r\n          [ngClass]=\"{\r\n            'ta-font': this.languageType === 'ta',\r\n            'fs-9': this.languageType === 'ta'\r\n          }\"\r\n          >{{ this.didDiscuss }}</span\r\n        >\r\n        <b> {{ teacherDetails.teacher_name }} ?</b>\r\n      </p>\r\n    </ion-text>\r\n    <div class=\"text-center\">\r\n      <ion-button\r\n        class=\"btn_modal-cancel\"\r\n        (click)=\"addClass(); showTextarea = true\"\r\n        [ngClass]=\"{\r\n          'ta-font': this.languageType === 'ta',\r\n          'fs-10': this.languageType === 'ta'\r\n        }\"\r\n        >{{ this.no }}</ion-button\r\n      >\r\n      <ion-button\r\n        class=\"btn_modal-success\"\r\n        (click)=\"dismiss('yes',''); showTextarea = false\"\r\n        [ngClass]=\"{\r\n          'ta-font': this.languageType === 'ta',\r\n          'fs-10': this.languageType === 'ta'\r\n        }\"\r\n        >{{ this.yes }}</ion-button\r\n      >\r\n    </div>\r\n    <div *ngIf=\"showTextarea\" class=\"text-center\">\r\n      <ion-item>\r\n        <ion-textarea\r\n          placeholder=\"Reason for not discussing\"\r\n          class=\"ion_text-area\"\r\n          #reason\r\n        ></ion-textarea>\r\n      </ion-item>\r\n      <p\r\n        *ngIf=\"submitted\"\r\n        class=\"error\"\r\n        [ngClass]=\"{\r\n          'ta-font': this.languageType === 'ta',\r\n          'fs-10': this.languageType === 'ta'\r\n        }\"\r\n      >\r\n        {{ this.giveReason }}\r\n      </p>\r\n\r\n      <ion-button\r\n        color=\"primary\"\r\n        (click)=\"dismiss('no', reason)\"\r\n        class=\"br-30\"\r\n        [ngClass]=\"{\r\n          'ta-font': this.languageType === 'ta',\r\n          'fs-12': this.languageType === 'ta'\r\n        }\"\r\n        ><b>{{ this.submit }}</b></ion-button\r\n      >\r\n    </div>\r\n  </div>\r\n</ion-content>\r\n";
