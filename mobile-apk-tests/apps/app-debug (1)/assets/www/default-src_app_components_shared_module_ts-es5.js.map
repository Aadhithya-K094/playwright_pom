export default "<ion-content>\r\n  <ion-icon name=\"close-circle\" style=\"float: right;font-size:30px\" (click)=\"dismiss('ok')\"></ion-icon>\r\n  <div class=\"modalcontent-wrapper\">\r\n    <ion-text  color=\"\" class=\"ion-text-center pt-2\" style=\"color:#8B67B3;font-size: 16px;\">\r\n      <p><b> Please select the reason for skipping a student?</b></p>\r\n    </ion-text>\r\n\r\n    <div >\r\n      <ion-list>\r\n        <ion-radio-group value=\"selectedReason\">\r\n          <ion-item lines=\"none\">\r\n            <ion-label>Issue with \"Google Read Along\" app</ion-label>\r\n            <ion-radio slot=\"start\" (click)=\"selectReason('Issue with Google Read Along app')\" value=\"Issue with Google Read Along app\"></ion-radio>\r\n          </ion-item>\r\n      \r\n          <ion-item lines=\"none\">\r\n            <ion-label>Others</ion-label>\r\n            <ion-radio slot=\"start\" (click)=\"selectReason('others')\" value=\"others\"></ion-radio>\r\n          </ion-item>\r\n                \r\n        </ion-radio-group>\r\n      </ion-list>      \r\n    </div>\r\n\r\n    <div  class=\"d-flex justify-content-center\">\r\n      <ion-button class=\"btn_modal-cancel\" (click)=\"canceldismiss('cancel')\"\r\n        [ngClass]=\"{'ta-font': this.languageType === 'ta','fs-11': this.languageType === 'ta','modal-btn-w-50': this.languageType === 'ta'}\">\r\n        Cancel</ion-button>\r\n      <ion-button class=\"btn_modal-success\" (click)=\"dismiss('ok')\"\r\n        [ngClass]=\"{'ta-font': this.languageType === 'ta','fs-11': this.languageType === 'ta','modal-btn-w-50': this.languageType === 'ta'}\">\r\n        ok</ion-button>\r\n    </div>    \r\n  </div>\r\n</ion-content>";
