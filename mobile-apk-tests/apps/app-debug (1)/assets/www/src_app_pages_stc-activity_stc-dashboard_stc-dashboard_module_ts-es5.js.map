export default "<ion-header >\r\n  <ion-toolbar >\r\n    <ion-buttons slot=\"start\" class=\"newback-icon\">\r\n      <ion-icon name=\"arrow-back\" (click)=\"navigateBack()\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n    <ion-title>Residential Special Training Centers</ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content>\r\n  <ion-row class=\"row-head\">\r\n    <ion-col *ngFor=\"let item of airArray; let i=index\" size=\"6\" class=\"menuList\">\r\n      <ion-row (click)=\"goToMenu(item)\">\r\n        <div class=\"divList\">\r\n          <img src=\"{{item.image}}\" style=\"margin: 10px auto;width: 50px; height: 40px;\">\r\n        </div>\r\n        <ion-col size=\"12\" class=\"menu-text\">\r\n          <ion-label class=\"newsecondaryTex\">{{item.menu}}</ion-label>\r\n        </ion-col>\r\n      </ion-row>\r\n    </ion-col>\r\n    <ion-col *ngIf=\"airArray.length == 0\" size=\"12\" style=\"display:flex; justify-content: center;\r\n    align-items: center;width: 100%; height: 80vh;\">\r\n      <div >No Data Found</div>\r\n    </ion-col>\r\n  </ion-row>\r\n</ion-content>\r\n";
