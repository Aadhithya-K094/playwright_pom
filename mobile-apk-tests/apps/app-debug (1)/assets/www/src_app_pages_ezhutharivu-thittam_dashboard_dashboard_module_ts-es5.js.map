export default "<ion-header>\r\n  <ion-toolbar>\r\n    <ion-buttons slot=\"start\" class=\"newback-icon\">\r\n      <ion-icon name=\"arrow-back\" (click)=\"navigationBack()\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n    <ion-title>\r\n      <ion-row>\r\n        <ion-col size=\"12\" style=\"padding-bottom: 0px;\">\r\n          Menu\r\n        </ion-col>\r\n        <ion-col size=\"12\" style=\"padding-top: 0px;\">\r\n          <span style=\"font-size: 14px;\">{{this.schoolData.school_name}}</span>\r\n        </ion-col>\r\n      </ion-row></ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content>\r\n  <ion-card *ngFor=\"let item of menuLists\" (click)=\"onMenuNavigate(item);\">\r\n    <ion-card-content>\r\n      <ion-row>\r\n        <img [src]=\"item.image\" /><br />\r\n        <ion-label class=\"lbl\">{{item.menu}}</ion-label>\r\n      </ion-row>\r\n    </ion-card-content>\r\n  </ion-card>\r\n</ion-content>";
