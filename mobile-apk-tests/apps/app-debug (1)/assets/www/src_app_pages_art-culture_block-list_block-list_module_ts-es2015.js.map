export default "\r\n\r\n\r\n<ion-header>\r\n  <ion-toolbar class=\"toolbar\">\r\n    <ion-buttons slot=\"start\" class=\"pt-10\" (click)=\"backBtn()\">\r\n      <ion-icon class=\"back-icon\" size=\"large\" name=\"arrow-back\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n    <ion-title class=\"pt-15\">Block-list</ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n\r\n<ion-content class=\"graybackgrond\">\r\n  <ion-grid>\r\n    <ion-row *ngIf=\"blocklistActive\" class=\"total\">\r\n      <ion-col size=\"6\" class=\"total-txt\">\r\n        <ion-label>Total Blocks</ion-label>\r\n      </ion-col>\r\n      <ion-col size=\"6\" class=\"total-subtxt\">\r\n        <ion-label>{{blockLength}}</ion-label>\r\n      </ion-col>\r\n    </ion-row>\r\n\r\n    \r\n\r\n    <div *ngIf=\"blocklistActive\">\r\n      <ion-card *ngFor=\"let item of blocklist; let i = index;\" (click)=\"getarpenrollment(item)\">\r\n        <ion-row style=\"width:100%\">\r\n          <ion-col size=\"1\" style=\"align-content: center; align-self: center;\">\r\n            <img src=\"./../../../../../../assets/icons/Block.svg\">\r\n          </ion-col>\r\n          <ion-col size=\"11\" style=\"align-content: center; align-self: center;\">\r\n            <ion-label class=\"ion-text-wrap\">{{item.label}}</ion-label>\r\n          </ion-col>\r\n        </ion-row>\r\n      </ion-card>\r\n    </div>\r\n  </ion-grid>\r\n</ion-content>";
