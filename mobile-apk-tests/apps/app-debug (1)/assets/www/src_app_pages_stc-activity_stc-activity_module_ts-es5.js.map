export default "<ion-header >\r\n  <ion-toolbar >\r\n    <ion-buttons slot=\"start\" class=\"newback-icon\">\r\n      <ion-icon name=\"arrow-back\" (click)=\"navigateBack()\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n    <ion-title>{{Type == 1 ? 'Tamil Mozhi Karpom' : 'RSTC'}}</ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content>\r\n  <ion-row class=\"row-head\">\r\n    <ion-col *ngFor=\"let item of airArray; let i=index\" class=\"menuList\">\r\n      <ion-row (click)=\"goToMenu(item)\">\r\n        <div class=\"divList\">\r\n          <img src=\"{{item.icon}}\" style=\"margin: 10px auto;width: 44px;\r\n          height: 33px;\">\r\n        </div>\r\n        <ion-col size=\"12\" class=\"menu-text\">\r\n          <ion-label class=\"newsecondaryTex\">{{item.name}}</ion-label>\r\n        </ion-col>\r\n      </ion-row>\r\n    </ion-col>\r\n  </ion-row>\r\n</ion-content>\r\n";
