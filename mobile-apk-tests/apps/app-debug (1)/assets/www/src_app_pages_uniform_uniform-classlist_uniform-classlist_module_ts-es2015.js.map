export default "<ion-header>\r\n  <ion-toolbar class=\"newprimary\">\r\n    <ion-buttons slot=\"start\" class=\"newback-icon\">\r\n      <ion-icon name=\"arrow-back\" (click)=\"navigateBack()\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n    <ion-title> {{schoolName}}\r\n      </ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content>\r\n\r\n    <ion-row class=\"rowclass\">\r\n      <ion-col size=\"12\">\r\n        <div> Class</div>\r\n      </ion-col>\r\n      <ion-col size=\"3\" *ngFor=\"let data of uniqueclass\" style=\"text-align: center;\">\r\n       <div (click)=\"selectSection(data.class)\" *ngIf=\"class_studying_id == data.class\">\r\n          <ion-card class=\"classcardSelect\"> {{data.class}} </ion-card>\r\n       </div> \r\n       <div (click)=\"selectSection(data.class)\" *ngIf=\"class_studying_id != data.class\">\r\n        <ion-card class=\"classcard\"> {{data.class}} </ion-card>\r\n       </div>\r\n      </ion-col>\r\n    </ion-row>\r\n\r\n    <ion-row class=\"rowclass\" *ngIf=\"sectionActive\">\r\n      <ion-col size=\"12\">\r\n        <div> Section </div>\r\n      </ion-col>\r\n      <ion-col size=\"3\" *ngFor=\"let data of studentSeclist\" style=\"text-align: center;\">\r\n        <ion-card class=\"classcard\" (click)=\"navigateNext(data.class,data.sec)\"> {{data.sec}} </ion-card>\r\n      </ion-col>\r\n    </ion-row>\r\n\r\n</ion-content>\r\n";
