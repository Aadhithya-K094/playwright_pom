export default "<ion-header>\r\n  <ion-toolbar>\r\n\r\n    <ion-title>\r\n      <div class=\"ion-text-wrap\">View Pdf</div>\r\n    </ion-title>\r\n\r\n    <ion-buttons slot=\"end\" class=\"pt-10\" style=\"zoom:1.0\">\r\n      <ion-icon class=\"back-icon\" name=\"close-outline\" (click)=\"closeModal()\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content  class=\"graybackgrond\">\r\n  \r\n  <div id=\"outerContainer\">\r\n  <div class=\"pdf-container\">\r\n    <pdf-viewer *ngIf=\"this.ext == 'pdf'\" src=\"{{src}}\" [fit-to-page]=\"true\" [zoom]=\"zoom\" [original-size]=\"true\"  [render-text]=\"false\" style=\"display: block; width: 100%; height: 800px;\"></pdf-viewer>\r\n    <img *ngIf=\"this.ext == 'jpg' || 'jpeg'\" src=\"{{src}}\" class=\"img image\">\r\n  </div>\r\n</div>\r\n\r\n  <!-- <iframe style=\"width: 100%; height: 100%;\"  [src]=\"src\" frameborder=\"0\" allowfullscreen></iframe> -->\r\n</ion-content>\r\n\r\n\r\n<ion-footer class=\"\" >\r\n  <div class=\"footer-txt\" >\r\n    <ion-row>\r\n      <ion-col size=\"6\">\r\n      <button ion-button  >\r\n        <ion-icon name=\"remove-outline\" (click)=\"incrementZoom(-0.1)\"></ion-icon>\r\n       </button> \r\n    </ion-col>\r\n    <ion-col size=\"6\">\r\n      <button ion-button >\r\n        <ion-icon name=\"add-outline\" (click)=\"incrementZoom(0.1)\"></ion-icon>\r\n      </button>\r\n    </ion-col> \r\n\r\n      <!-- <ion-col size=\"3\">\r\n        <ion-icon name=\"thumbs-up\" [ngClass]=\"{'like-button': true, 'liked': (likeState === 'liked')}\" (click)=\"incrementLike()\"></ion-icon>\r\n      </ion-col>\r\n      <ion-col size=\"3\">\r\n        <ion-icon name=\"thumbs-down\" [ngClass]=\"{'dislike-button': true, 'disliked': (likeState === 'disliked')}\" (click)=\"incrementDisLike()\"></ion-icon> \r\n      </ion-col> -->\r\n    </ion-row>\r\n    <!-- <ion-row style=\"margin: 12px;\">\r\n      <ion-col size=\"12\">\r\n        <div style=\"font-size: 14px;text-align: left;\">\r\n          <ion-label>\r\n            Comments\r\n          </ion-label>\r\n        </div>\r\n      </ion-col>\r\n      <ion-col size=\"12\"  style=\"border: 1px solid lightgray;\">\r\n        <ion-row>\r\n          <ion-col size=\"10\">\r\n            <div>\r\n              <ion-input style=\"text-align: left\" maxLength=\"200\" [multiple]=\"true\" [(ngModel)]=\"comment\"></ion-input>\r\n            </div>\r\n          </ion-col>\r\n          <ion-col size=\"2\">\r\n            <div style=\"background-color: #1565c0;padding: 10px;color: white;border-radius: 5px;\" (click)=\"saveCmts()\" >\r\n              <ion-icon name=\"arrow-forward\"></ion-icon>\r\n            </div>\r\n          </ion-col>\r\n        </ion-row>\r\n      </ion-col>\r\n      <ion-col size-md = \"12\">\r\n        <ion-textarea class = \"italic\" rows=\"10\" cols=\"5\" maxlength = \"200\" placeholder=\"Enter your comments\"  [(ngModel)]=\"postFeedback.explanation\"></ion-textarea>\r\n     </ion-col>\r\n\r\n\r\n    </ion-row> -->\r\n  </div>\r\n</ion-footer>";
