export default "<ion-header>\r\n  <ion-toolbar text-wrap>\r\n    <ion-buttons slot=\"start\" class=\"pt-10\">\r\n      <ion-icon class=\"back-icon\" size=\"large\" name=\"arrow-back\" (click)=\"navigateBack()\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n    <!-- <ion-title class=\"pt-15\">{{schName}}</ion-title> -->\r\n    <ion-title class=\"pt-15\" text-wrap>{{schlName}}</ion-title>\r\n\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content>\r\n  <ion-card class=\"card-align ion-card-margin\">\r\n    <div class=\"cards\" *ngFor=\"let menuItem of assessmentMenuList;let i = index\">\r\n      <!-- {{mode}} : mode {{menuItem.value}} : menuItem -->\r\n      <ion-card class=\"card-design ion-card-margin-top-bottom\" (click)=\"navigateStudents(menuItem.value)\"\r\n        [ngStyle]=\"{'background': menuItem.value ? 'var(--seconday-color-change)' : '#E9E9E9'}\">\r\n        <div class=\"card-text\">\r\n          <ion-label class=\"schoolnames\"\r\n            [ngStyle]=\"{'background': menuItem.value  ? 'var(--seconday-color-change)' : '#E9E9E9', 'color': (mode == 'DarkMode' && menuItem.value != '1') ? '#4c4a4a' : (mode == 'DarkMode' && menuItem.value == '1') ? 'var(--primary-text-color)' : '#4c4a4a'}\">\r\n            {{menuItem.label}} </ion-label>\r\n        </div>\r\n        <div class=\"image-outer\">\r\n          <img class=\"img\" src={{menuItem.img}} />\r\n        </div>\r\n      </ion-card>\r\n    </div>\r\n  </ion-card>\r\n</ion-content>";
