export default "<ion-header>\r\n  <ion-toolbar class=\"new-background-color\">\r\n    <ion-buttons slot=\"start\">\r\n      <ion-menu-button></ion-menu-button>\r\n    </ion-buttons>\r\n    <ion-title>Dashboard</ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n<ion-content class=\"ion-contentbg\">\r\n  <ion-grid>\r\n    <ion-row>\r\n      <ion-col size=\"12\">\r\n          <ion-slides #IonSlides pager=\"true\" [options]=\"options\" (ionSlidesDidLoad)=\"slidesDidLoad(IonSlides)\">\r\n              <ion-slide>\r\n                 <ion-img src=\"../../assets/img/studying.png\"></ion-img>\r\n                </ion-slide>          \r\n              <ion-slide>\r\n                  <ion-img src=\"../../assets/img/stuparent.png\"></ion-img>\r\n              </ion-slide>\r\n              <ion-slide>\r\n                  <ion-img src=\"../../assets/img/Teacher.png\"></ion-img>\r\n              </ion-slide>\r\n          </ion-slides>          \r\n      </ion-col>\r\n    </ion-row>\r\n    <ion-row>\r\n      <ion-col size=\"4\">\r\n          <ion-card routerLink=\"/tnvntabs/page-route/observation-list\" routerDirection=\"forward\">\r\n              <ion-card-header style=\"text-align:center;\">                \r\n                <ion-card-title> <ion-icon name=\"eye\"></ion-icon></ion-card-title>\r\n              </ion-card-header>  \r\n              <ion-card-content style=\"text-align:center;\">\r\n                  OBSERVATIONS\r\n              </ion-card-content>\r\n            </ion-card>\r\n      </ion-col>       \r\n    </ion-row> \r\n</ion-grid>  \r\n</ion-content>\r\n";
