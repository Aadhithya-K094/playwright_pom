export default "<ion-header>\r\n  <ion-toolbar class=\"new-background-color\">\r\n    <ion-buttons slot=\"start\">\r\n      <ion-back-button></ion-back-button>\r\n    </ion-buttons>\r\n    <ion-title>Classes Information</ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content >\r\n  <ion-label padding>Select the Class</ion-label><br/>\r\n  <ion-grid>\r\n  <ion-card *ngFor=\"let class of data_value;let i=index; let class_even=even;let class_odd=odd\">\r\n      <ion-row [ngClass]={class_even:class_even,class_odd:class_odd}>\r\n      <ion-col size=\"4\" *ngFor=\"let sec of class.sections;let first=first;let chilIndex=index; let sec_even=even;let sec_odd=odd\" >\r\n          <ion-ripple-effect></ion-ripple-effect>\r\n        <ion-card (click)=\"onClick(class,chilIndex)\" [ngClass]={sec_even:sec_even,sec_odd:sec_odd} [style.background-color]=\"chilIndex < 1 ? randomColor[i] : ''\">  \r\n           \r\n          <div style=\"font-size:16px;\"><b>{{class.class_name}} </b><span style=\"font-size:16px;\">'{{sec.section}}'</span></div>\r\n          <div style=\"font-size:13px;\"><ion-icon name=\"man\"></ion-icon>{{sec.male}} <span style=\"font-size:13px;\"><ion-icon name=\"woman\"></ion-icon>{{sec.female}}</span></div>   \r\n        </ion-card>\r\n    \r\n      </ion-col>      \r\n    </ion-row>\r\n  </ion-card>\r\n</ion-grid>\r\n</ion-content>\r\n";
