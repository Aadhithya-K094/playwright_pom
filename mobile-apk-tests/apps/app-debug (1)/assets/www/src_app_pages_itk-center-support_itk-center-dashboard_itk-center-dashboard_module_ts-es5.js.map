export default "<!-- <ion-header>\r\n  <ion-toolbar>\r\n    <ion-buttons slot=\"start\" class=\"back-button\" (click)=\"goBack()\">\r\n\t\t\t<ion-button>\r\n\t\t\t\t<ion-icon slot=\"icon-only\" name=\"arrow-back-outline\"></ion-icon>\r\n\t\t\t</ion-button>\r\n\t\t</ion-buttons>\r\n    <ion-title>ITK Center Dashboard</ion-title>\r\n  </ion-toolbar>\r\n</ion-header> -->\r\n\r\n<ion-header>\r\n  <ion-toolbar>\r\n    <ion-buttons slot=\"start\" class=\"pt-10\" (click)=\"goBack()\">\r\n      <ion-icon class=\"back-icon\" size=\"large\" name=\"arrow-back\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n    <ion-title class=\"pt-15\"> ITK Center Dashboard </ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n\r\n<ion-content class=\"graybackgrond\"> \r\n  <div style=\"height: 100%;\">\r\n    <ion-grid style=\"padding: 10px\">\r\n      <ion-row class=\"square-container\">\r\n        <ion-col size=\"6\" *ngFor=\"let item of menuLists\" (click)=\"navigatePage(item,item.url,item.mod1)\">\r\n          <ion-card class=\"card-menu\">\r\n            <div class=\"ion-margin-top ion-margin-bottom\">\r\n              <img [src]=\"item.image\" /><br />\r\n              <span style=\"font-weight: 500;\">{{item.menu}}</span>\r\n            </div>\r\n          </ion-card>\r\n        </ion-col>\r\n      </ion-row>\r\n    </ion-grid>\r\n  </div>\r\n</ion-content>\r\n";
