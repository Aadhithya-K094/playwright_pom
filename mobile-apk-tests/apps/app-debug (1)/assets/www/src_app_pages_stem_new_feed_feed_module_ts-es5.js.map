export default "<ion-header>\r\n  <ion-toolbar>\r\n    <ion-buttons slot=\"start\" class=\"pt-10\">\r\n      <ion-icon class=\"back-icon\" size=\"large\" name=\"arrow-back\" (click)=\"navigateBack()\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n    <ion-title class=\"pt-15\" style=\"font-size: 20px\">Experiments</ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content>\r\n  <ion-grid class=\"login-bg\">\r\n\r\n  </ion-grid>\r\n  <!-- <ion-row>\r\n\r\n    <ion-col size=\"12\">\r\n      <ion-icon name=\"arrow-back\" style=\"margin-top: 3%;margin-left: 3%;margin-right: 2%;zoom: 1.3;\" (click)=\"navigateBack()\">  </ion-icon> <span style=\"margin-top: 3%;margin-left: 3%;margin-right: 2%;zoom: 1.3;\"> Experiments </span>\r\n    </ion-col>\r\n\r\n    <ion-col size=\"12\" style=\"padding: 5%;\" *ngFor=\"let item of vidUrl\">\r\n      <div style=\"padding: 3%;color: blue;\"> {{item.name}} </div>\r\n      <video controls width=\"100%\" height=\"210\" [id]=this.filename type=\"video/mp4\">\r\n        <source [src]=item.url type=\"video/mp4\">\r\n      </video>\r\n\r\n      <ion-row> \r\n        <ion-col size=\"6\" (click)=\"viewFile(item.tpdf)\">\r\n          <img src=\"/assets/images/video_tamil.png\" class=\"menuicon\">  \r\n        </ion-col>\r\n    \r\n        <ion-col size=\"6\" (click)=\"viewFile(item.epdf)\">\r\n          <img src=\"/assets/images/video_english.png\" class=\"menuicon\">   \r\n        </ion-col>\r\n      </ion-row>\r\n\r\n    </ion-col>\r\n  \r\n  </ion-row> -->\r\n</ion-content>\r\n";
