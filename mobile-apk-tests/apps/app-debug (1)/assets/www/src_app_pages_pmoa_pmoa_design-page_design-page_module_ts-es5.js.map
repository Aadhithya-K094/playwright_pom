export default "<ion-header>\r\n  <ion-toolbar class=\"toolbar\">\r\n    <ion-buttons slot=\"start\" class=\"back-iconNew\" (click)=\"onGoButton()\">\r\n      <ion-icon name=\"arrow-back\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n    <ion-title class=\"pt-15\">\r\n      <div class=\"ion-text-wrap\">Academic Year</div>\r\n      <div class=\"ion-text-wrap floatLabel\">\r\n        <ion-icon name=\"person-circle-outline\" class=\"userlabel\"></ion-icon>\r\n        {{currUser}}\r\n      </div>\r\n    </ion-title>\r\n  </ion-toolbar>  \r\n</ion-header>\r\n\r\n<ion-content>\r\n  <ion-list>\r\n    <ng-container *ngFor=\"let year of Acdamicyear; let i = index\">\r\n      <ion-item (click)=\"toggleAccordion(year.AcYears, i)\">\r\n        <ion-label>{{ year.AcYears }}</ion-label>\r\n        <ion-icon name=\"chevron-down-outline\" slot=\"end\"></ion-icon>\r\n      </ion-item>\r\n      <ion-card *ngIf=\"year['view']\">\r\n        <ion-card-content *ngIf=\"selectedYear === year.AcYears\" style=\"background-color: #ac74be;\">\r\n          <ng-container *ngFor=\"let phase of year.Phase\">\r\n            <ion-card *ngIf=\"phase.viewstatus\" (click)=\"getawcname(phase.id,phase.viewstatus,phase.phaseName,year.AcYears)\"\r\n            >\r\n              <ion-card-header class=\"card-header-2\"\r\n              >{{phase.phaseName }}\r\n              <ion-icon *ngIf= \"phase.viewstatus != 1\" name=\"eye-outline\" class=\"icon-end\"></ion-icon>\r\n              <ion-icon *ngIf= \"phase.viewstatus == 1\" name=\"create\" class=\"icon-end\"></ion-icon></ion-card-header>\r\n\r\n            </ion-card>\r\n          </ng-container>\r\n          <!-- <ion-card>\r\n            <ion-card-header>{{year.phase}} {{ year.AcYears }}</ion-card-header>\r\n          </ion-card> -->\r\n        </ion-card-content>\r\n      </ion-card>\r\n    </ng-container>\r\n  </ion-list>\r\n</ion-content>";
