export default "<ion-header>\r\n  <ion-toolbar class=\"toolbar\">\r\n    <ion-buttons slot=\"start\" class=\"back-iconNew\" (click)=\"goHome()\">\r\n      <ion-icon name=\"arrow-back\" >\r\n      </ion-icon>\r\n    </ion-buttons>\r\n    <ion-title>\r\n      <div class=\"ion-text-wrap\" style=\"margin-left: 5px;\">HOSTEL</div>\r\n    </ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content class=\"secondary\">\r\n  <ion-row class=\"square-containers\">\r\n    <ion-col size=\"4\" *ngFor=\"let item of menuLists\" (click)=\"navigatePage(item)\">\r\n      <ion-card class=\"card-menu\">\r\n        <div class=\"ion-margin-top ion-margin-bottom\" style=\"padding-left: 5px;\r\n        padding-right: 5px;\"> \r\n          <img [src]=\"item.image\" /><br />\r\n          <span style=\"font-weight: 500;\">{{item.menu}}</span>\r\n        </div>\r\n      </ion-card>\r\n    </ion-col>\r\n  </ion-row>\r\n</ion-content>";
