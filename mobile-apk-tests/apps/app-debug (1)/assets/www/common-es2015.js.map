export default "<ion-header>\r\n  <ion-toolbar color=\"primary\">\r\n    <ion-buttons slot=\"end\" (click)=\"dismiss()\">\r\n      <ion-icon name=\"close-circle\" slot=\"icon-only\"></ion-icon>\r\n    </ion-buttons>\r\n    <ion-title style=\"padding-left: 3%;\"> {{Heading}} PDF</ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content>\r\n  <ion-row class=\"ion-padding ion-text-center\">\r\n    <ion-col size=\"12\" offset=\"1\" >\r\n      <pdf-viewer [src]=this.PDFFileName.changingThisBreaksApplicationSecurity [render-text]=\"true\" [original-size]=\"false\" style=\"width:100%!important;\">\r\n      </pdf-viewer>\r\n    </ion-col>\r\n  </ion-row>\r\n\r\n</ion-content>";
