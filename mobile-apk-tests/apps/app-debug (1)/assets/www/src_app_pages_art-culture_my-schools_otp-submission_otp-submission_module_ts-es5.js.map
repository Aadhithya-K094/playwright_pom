export default "<!-- <ion-header>\r\n  <ion-toolbar>\r\n    <ion-title>otp_submission</ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content>\r\n\r\n</ion-content> -->\r\n\r\n<ion-header>\r\n\r\n  <ion-toolbar class=\"toolbar\">\r\n\r\n    <ion-buttons slot=\"start\" class=\"pt-10\" (click)=\"backBtn()\">\r\n\r\n      <ion-icon class=\"back-icon\" size=\"large\" name=\"arrow-back\">\r\n\r\n      </ion-icon>\r\n\r\n    </ion-buttons>\r\n\r\n    <ion-title class=\"pt-15\">Session Details</ion-title>\r\n\r\n  </ion-toolbar>\r\n\r\n</ion-header>\r\n<ion-content style=\"--background:#917AFE\">\r\n  <div class=\"optMainDiv\">\r\n    <div style=\"text-align:center;\">\r\n      <!-- <img src=\"../../../../../assets/images/art-culture/otpimg.png\"><br><br> -->\r\n      <ion-label class=\"otpDiv\">Please enter the OTP</ion-label>\r\n    </div>\r\n  </div>\r\n\r\n  <div class=\"whiteDiv\">\r\n    <div>\r\n    <ion-row class=\"rowDiv\">\r\n\r\n      <ion-col>\r\n        <ion-input class=\"x\" #otp1 [(ngModel)]=\"otp\" required=\"true\" (ionChange)=\"otpdata($event)\" maxLength=\"10\">\r\n        </ion-input>\r\n      </ion-col>\r\n      <!-- <ion-col>\r\n        <ion-input class=\"x\" #otp2 required=\"true\" maxLength=\"1\">\r\n        </ion-input>\r\n      </ion-col>\r\n      <ion-col>\r\n        <ion-input class=\"x\" #otp3 required=\"true\" maxLength=\"1\">\r\n        </ion-input>\r\n      </ion-col>\r\n      <ion-col>\r\n        <ion-input class=\"x\" #otp4 required=\"true\" maxLength=\"1\">\r\n        </ion-input>\r\n      </ion-col>\r\n      <ion-col>\r\n        <ion-input class=\"x\" #otp5 required=\"true\" maxLength=\"1\">\r\n        </ion-input>\r\n      </ion-col>\r\n      <ion-col>\r\n        <ion-input class=\"x\" #otp6 required=\"true\" maxLength=\"1\">\r\n        </ion-input>\r\n      </ion-col> -->\r\n\r\n    </ion-row>\r\n    <ion-row>\r\n      <ion-col>\r\n        <div style=\"text-align: center;\" (click)=\"otpSave()\">\r\n          <ion-label class=\"btnLabel\">Submit</ion-label>\r\n        </div>\r\n      </ion-col>\r\n    </ion-row>\r\n   \r\n  </div>\r\n </div>\r\n\r\n</ion-content>";
