export default "<ion-header>\r\n  <ion-toolbar>\r\n\r\n    <ion-title>\r\n      <div class=\"ion-text-wrap\">View Pdf</div>\r\n    </ion-title>\r\n\r\n    <ion-buttons slot=\"end\" class=\"pt-10\" style=\"zoom:1.0\">\r\n      <ion-icon class=\"back-icon\" name=\"close-outline\" (click)=\"closeModal()\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content class=\"graybackgrond\">\r\n  <div id=\"outerContainer\">\r\n    <div class=\"pdf-container\">\r\n      <pdf-viewer *ngIf=\"ext == 'pdf'\" src=\"{{src}}\" [fit-to-page]=\"true\" [zoom]=\"zoom\" [original-size]=\"true\" [render-text]=\"false\" style=\"display: block; width: 100%; height: 800px;\"></pdf-viewer>\r\n      <img *ngIf=\"ext == 'jpg' || 'jpeg'\" src=\"{{src}}\" class=\"img image\">\r\n    </div>\r\n  </div>\r\n</ion-content>\r\n\r\n<ion-footer class=\"\" >\r\n  <div class=\"footer-txt\" >\r\n    <ion-row>\r\n      <ion-col size=\"6\">\r\n        <button ion-button  >\r\n          <ion-icon name=\"remove-outline\" (click)=\"incrementZoom(-0.1)\"></ion-icon>\r\n        </button> \r\n      </ion-col>\r\n      <ion-col size=\"6\">\r\n        <button ion-button >\r\n          <ion-icon name=\"add-outline\" (click)=\"incrementZoom(0.1)\"></ion-icon>\r\n        </button>\r\n      </ion-col>\r\n    </ion-row>\r\n  </div>\r\n</ion-footer>\r\n";
