export default "<ion-header>\r\n  <ion-toolbar>\r\n    <ion-buttons slot=\"start\" class=\"pt-10\">\r\n      <ion-icon class=\"back-icon\" size=\"large\" name=\"arrow-back\" (click)=\"goToBack()\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n    <ion-title class=\"pt-15\">Geo Fence</ion-title>\r\n  </ion-toolbar>\r\n</ion-header>  \r\n\r\n<ion-content class=\"secondary\">\r\n  <ion-card class=\"root-card\">\r\n      <ion-grid>\r\n        <ion-row class=\"square-containers\">\r\n          <ion-col size=\"4\" *ngFor=\"let item of menuList\" (click)=\"goToPages(item)\">\r\n            <ion-card class=\"card-menu\">\r\n              <div class=\"card-items \"> \r\n                <img [src]=\"item.image\" class=\"image\"/>\r\n                <span class=\"card-value\">{{item.menu}}</span>\r\n              </div>\r\n            </ion-card>\r\n          </ion-col>\r\n        </ion-row>\r\n      </ion-grid>\r\n  </ion-card>\r\n  </ion-content>\r\n\r\n";
