export default "<ion-header>\r\n  <ion-toolbar>\r\n    <ion-title style=\"padding-left: 15px;\">\r\n      <div class=\"ion-text-wrap\">Switch User</div>\r\n    </ion-title>\r\n    <ion-buttons slot=\"end\" class=\"pt-10\" style=\"zoom:1.5\">\r\n      <ion-icon class=\"back-icon\" name=\"close-outline\" (click)=\"closeModal()\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content>\r\n  <ion-card>\r\n    <ion-list *ngFor=\"let data of userList\">\r\n      <ion-item (click)=\"switchUser(data.teacher_id)\" [disabled]=\"data.teacher_id == this.teacher_id ? 'true': 'false'\">\r\n        <ion-label>{{data.teacher_id}}</ion-label>\r\n        <p class=\"text\">{{data.designation}}</p>\r\n      </ion-item>\r\n    </ion-list>\r\n  </ion-card>\r\n</ion-content>";
