export default "<ion-header>\r\n  <ion-toolbar>\r\n    <ion-buttons slot=\"start\" class=\"newback-icon\">\r\n      <ion-icon name=\"arrow-back\" (click)=\"navigationBack()\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n    <ion-title>School List</ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content>\r\n  <ion-searchbar class=\"search\" placeholder=\"Search\" (ionChange)=\"onSearch(schoolList,$event)\"></ion-searchbar>\r\n\r\n  <ion-card *ngFor=\"let item of schoolList\" (click)=\"onMenuNavigate(item);\">\r\n    <ion-card-content>\r\n      <ion-row>\r\n        <ion-col size=\"12\" style=\"padding:0px;\">\r\n          <ion-label class=\"lbl\">{{item.school_name}}</ion-label>\r\n        </ion-col>\r\n        <ion-col size=\"12\" style=\"padding:0px;color:rgb(61, 60, 60);\">\r\n          <ion-label>{{item.udise_code}}</ion-label>\r\n        </ion-col>\r\n      </ion-row>\r\n    </ion-card-content>\r\n  </ion-card>\r\n</ion-content>";
