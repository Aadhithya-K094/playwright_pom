export default "<ion-content>\r\n\r\n  <ion-row class=\"header-image\">\r\n    <ion-col size=\"12\">\r\n      <ion-row>\r\n        <ion-col size=\"3\" style=\"font-size: x-large;\">\r\n           <ion-icon style=\"margin-top: 2%;\" name=\"arrow-back\" (click)=\"navigateBack()\">\r\n          </ion-icon>\r\n        </ion-col>\r\n        <ion-col size=\"9\" style=\"padding-left:5%;font-size: large;color: white;\">\r\n          Experiments \r\n        </ion-col>\r\n      </ion-row>\r\n      <ion-row *ngFor=\"let item of airArray\">\r\n        <ion-col size=\"4\" style=\"text-align: end;margin-bottom: 3%;\">\r\n        <img src={{item.icon}} />  \r\n        </ion-col>\r\n        <ion-col size=\"8\" style=\"text-align:start;color: white;align-self: center;\r\n        margin-bottom: 3%;\" (click)=\"onNext(item.url,item.name,item.tPdf,item.ePdf)\">  \r\n        {{item.name}} \r\n        </ion-col>\r\n      </ion-row>\r\n    </ion-col>\r\n    \r\n  </ion-row>\r\n\r\n</ion-content> ";
