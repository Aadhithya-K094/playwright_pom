export default "<ion-header>\r\n  <ion-toolbar class=\"header-style\">\r\n    <ion-buttons slot=\"start\">\r\n      <ion-back-button defaultHref=\"tabs/module-menu\"></ion-back-button>\r\n    </ion-buttons>\r\n    <ion-title>Palli Parvai</ion-title>\r\n    <span class=\"header-span\" *ngIf=\"emis_usertype == '39' && emis_usertype1 == '1'\">L1 - 2</span>\r\n    <span class=\"header-span\" *ngIf=\"emis_usertype == '6' && (emis_usertype1 == '1' || emis_usertype1 == '2')\">L2 - 2</span>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content>\r\n  <ion-card class=\"card-content\">\r\n    <!-- <ion-item button (click)=\"classRoom()\" detail>\r\n      <img width=\"30\" src=\"/assets/images/ennum-ezhuthum/classroomdetails.png\" />\r\n      <ion-label class=\"ion-text-center\">\r\n        Classroom Details\r\n      </ion-label>\r\n    </ion-item> -->\r\n    <!-- <ion-item button (click)=\"palliparvaiRoute()\" detail>\r\n      <img width=\"30\" src=\"/assets/images/ennum-ezhuthum/classroomdetails.png\" />\r\n      <ion-label class=\"ion-text-center\">\r\n        School Observation\r\n      </ion-label>\r\n    </ion-item>\r\n    <ion-item button (click)=\"palliparvaiRoute('/tabs/school-observation')\" detail>\r\n      <img width=\"30\" src=\"/assets/images/ennum-ezhuthum/classroomdetails.png\" />\r\n      <ion-label class=\"ion-text-center\">\r\n        Ennum Ezhuthum 2022-2023\r\n      </ion-label>\r\n    </ion-item> -->\r\n    <span>\r\n      <ion-item button (click)=\"navigateModule()\" detail>\r\n        <img width=\"30\" src=\"/assets/images/ennum-ezhuthum/formative.png\" />\r\n        <ion-label class=\"ion-text-center\">\r\n          Summative 2023-2024\r\n        </ion-label>\r\n      </ion-item>\r\n    </span>\r\n    <!-- <ion-item button detail routerLink=\"/tabs/assessment-report-menu\">\r\n      <img width=\"30\" src=\"/assets/images/ennum-ezhuthum/studentreportcard.png\" />\r\n      <ion-label class=\"ion-text-center\">\r\n        Assessment Reports\r\n      </ion-label>\r\n    </ion-item> -->\r\n  </ion-card>\r\n\r\n\r\n  <!-- <ion-col size=\"12\" class=\"ion-text-center\">\r\n    <div *ngIf=\"saving\" style=\"padding:5px;padding: 10px;\r\n    background: #c5c1c1;\">Saving...</div>\r\n    <div>\r\n      <ion-button *ngIf=\"remainguserdata > 0\" style=\"--background: #c34242;width: 90%;\r\n        margin: 20px\"\r\n        (click)=\"saveRemainingData();saveRemainingDataFormative();saveRemainingDataSummative();saveRemainingDataFormative_A()\">Data\r\n        Save Pending</ion-button>\r\n    </div>\r\n  </ion-col> -->\r\n</ion-content>";
