export default "<!-- <ion-header>\r\n  <ion-toolbar>\r\n    <ion-title>course-materials</ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content>\r\n\r\n</ion-content> -->\r\n<ion-header >\r\n  <ion-toolbar class=\"toolbar\">\r\n    <ion-buttons slot=\"start\" class=\"pt-10\" (click)=\"backBtn()\">\r\n      <ion-icon class=\"back-icon\" size=\"large\" name=\"arrow-back\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n    <ion-title class=\"pt-15\">Course Materials</ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content>\r\n  <ion-card style=\"padding-top: 20px;\" *ngFor=\"let data of overAlldata; let i = index \">\r\n    <ion-row (click)=\"viewdetails(data,i)\">\r\n      <ion-col size=\"12\" *ngIf=\"i == showIndex && downloadedname\">\r\n        <!-- <video width=\"100%\" height=\"210\" id=\"class_in_iframe\">\r\n          <source src=https://d1e5r329t7a85t.cloudfront.net/87ad9d66641742f18ed5d1ee873eb370.mp4 type=\"video/mp4\">\r\n        </video> -->\r\n\r\n        <!-- <video controls width=\"100%\" height=\"100%\" type=\"video/mp4\" controlsList=\"nodownload\">\r\n          <source [src]=this.vidUrl type=\"video/mp4\">\r\n        </video> -->\r\n\r\n        <video *ngIf=\"data.video_1\" controls width=\"100%\" height=\"210\" #video type=\"video/mp4\" controlsList=\"nodownload\">\r\n          <source [src]=this.vidUrl type=\"video/mp4\">\r\n        </video>\r\n\r\n        <audio controls=\"false\" *ngIf=\"data.audio\" #video>\r\n          <source src=\"{{audioUrl}}\"  type=\"audio/mp3\">\r\n          Your browser does not support the audio element.\r\n        </audio>\r\n       \r\n      </ion-col>\r\n      <ion-col size=\"12\" *ngIf=\"i == showIndex && !downloadedname\">\r\n        <ion-label>We don't have the video</ion-label>\r\n      </ion-col>\r\n      <ion-col size=\"8\" style=\"text-align: center; margin-top: 10px;\">\r\n        <div> <ion-label>{{data.learning_plan}}</ion-label></div>\r\n       <!-- <div> <ion-label>220 mins</ion-label></div> -->\r\n       \r\n      </ion-col>\r\n\r\n      <ion-col size=\"4\" style=\"text-align: center;\">\r\n      <ion-img src=\"../assets/images/art&culture/playicon.png\"  style=\"height: 40px; margin-top: 10px;\" class=\"playimg\"></ion-img>\r\n      </ion-col>\r\n    </ion-row>\r\n    \r\n  </ion-card>\r\n\r\n  <!-- <ion-card>\r\n    <ion-row>\r\n      <ion-col size=\"4\">\r\n        <video controls width=\"100%\" height=\"100%\" [id]=this.filename type=\"video/mp4\" controlsList=\"nodownload\">\r\n          <source [src]=this.vidUrl type=\"video/mp4\">\r\n        </video>\r\n       \r\n      </ion-col>\r\n      <ion-col size=\"4\" style=\"text-align: center; margin-top: 10px;\">\r\n        <div> <ion-label>Mask Making</ion-label></div>\r\n       <div> <ion-label>220 mins</ion-label></div>\r\n       \r\n      </ion-col>\r\n\r\n      <ion-col size=\"4\" style=\"text-align: center;\">\r\n      <ion-img src=\"../assets/images/art&culture/playicon.png\"  style=\"height: 40px; margin-top: 10px;\"></ion-img>\r\n      </ion-col>\r\n    </ion-row>\r\n      \r\n    \r\n  </ion-card> -->\r\n</ion-content>";
