export default "\r\n<ion-header>\r\n  <ion-toolbar>\r\n    <ion-buttons slot=\"start\" class=\"pt-10\">\r\n      <ion-icon class=\"back-icon\" size=\"large\" name=\"arrow-back\" (click)=\"navigateBack()\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n    <ion-title>\r\n      <div class=\"header-data\">\r\n        <div class=\"ion-text-wrap\">Section</div>\r\n      </div>\r\n    </ion-title>\r\n    <!-- <ion-buttons slot=\"end\" class=\"pt-10\">\r\n      <ion-icon class=\"back-icon\" size=\"large\" name=\"sync\" (click)=\"onSync()\">\r\n      </ion-icon>\r\n    </ion-buttons> -->\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content>\r\n  <ion-card class=\"card-align ion-card-margin\">\r\n    <div class=\"cards \">\r\n        <!-- showStudentClassesSection -->\r\n        <div  class=\"sectionSmallCards \">\r\n            <div *ngIf=\"sectionArr.length === 0\">\r\n              <h5 class=\"dataNotFound\">Data Not Found</h5>\r\n           </div>\r\n            <div *ngIf=\"sectionArr.length > 0\">\r\n              <ion-row>\r\n                <ion-col size=\"4\" *ngFor=\"let section of sectionArr\">\r\n\r\n                  <!-- {{section.Unscrn}} : Unscrn {{section.Scrn}} : Scrn {{section.tot}} : tot -->\r\n                  <ion-card class=\"classcard\" (click)=\"selectSection(section)\" [class.unScreen]=\"section.Unscrn != 0\" [class.Screen]=\"section.tot == section.Scrn && section.tot != 0\">\r\n                    <div style=\"text-align: center;\">\r\n                      <ion-label class=\"classNo\">{{ section.Sec }}</ion-label><br>\r\n                      <ion-label class=\"classText\">Std</ion-label>\r\n                    </div>\r\n                  </ion-card>\r\n                </ion-col>\r\n              </ion-row>\r\n            </div>\r\n        </div>\r\n    </div>\r\n  </ion-card>\r\n</ion-content>";
