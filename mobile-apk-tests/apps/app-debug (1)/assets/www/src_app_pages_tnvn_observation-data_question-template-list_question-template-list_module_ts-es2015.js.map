export default "<ion-header>\r\n  <ion-toolbar  class=\"new-background-color\">\r\n      <ion-buttons slot=\"start\">\r\n          <ion-back-button></ion-back-button>\r\n        </ion-buttons>\r\n    <ion-title>Question Templates</ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content class=\"content_root\">\r\n<ion-card *ngFor=\"let template of template_list;let i=index\" (click)=\"choose_question(template)\">\r\n  <ion-ripple-effect></ion-ripple-effect>\r\n    <ion-card-content>\r\n            <ion-col size=\"2\" class=\"temp_id\">{{i+1}}</ion-col>\r\n            <ion-col size=\"20\" class=\"temp_name\"> <ion-label>{{template.name}}</ion-label></ion-col>\r\n            <ion-col *ngIf=\"template.color== 'green'\"   size=\"1\"  class=\"temp_status\"><ion-icon class=\"icon_end\"[ngStyle]=\"{'color': template.color}\" [name]=\"template.is_answered ? 'done-all' : 'close'\"></ion-icon></ion-col>          \r\n    </ion-card-content>\r\n \r\n</ion-card>\r\n</ion-content>\r\n<ion-footer>\r\n    <ion-button expand=\"full\" color=\"primary\" shape=\"round\" (click)=\"onSubmit()\">Complete <ion-icon name=\"checkmark-circle-outline\"></ion-icon></ion-button>\r\n</ion-footer>\r\n";
