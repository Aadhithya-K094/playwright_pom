export default "<ion-content>\r\n  <ion-tabs>\r\n    <ion-tab-bar justify-content-center slot=\"bottom\">\r\n      <ion-tab-button justify-content-center (click)=\"goToHome()\">\r\n        <ion-icon name=\"home\" class=\"icon\"></ion-icon>\r\n        <ion-label class=\"text\" (click)=\"goToHome()\">Home</ion-label>\r\n        <ion-router-outlet name=\"home\" (click)=\"goToHome()\"></ion-router-outlet>\r\n      </ion-tab-button>\r\n      <!-- <ion-tab-button justify-content-center>\r\n        <ion-icon name=\"notifications\" class=\"icon\"></ion-icon>\r\n        <ion-label class=\"text\" (click)=\"goToNotifications()\">Inbox</ion-label>\r\n        <ion-router-outlet name=\"notification\" (click)=\"goToNotifications()\"></ion-router-outlet>\r\n      </ion-tab-button> -->\r\n      <ion-tab-button justify-content-center (click)=\"fabParent()\">\r\n        <ion-icon name=\"ellipsis-vertical-outline\" class=\"icon\"></ion-icon>\r\n        <ion-label class=\"text\">More</ion-label>\r\n      </ion-tab-button>\r\n    </ion-tab-bar>\r\n  </ion-tabs>\r\n\r\n  <ion-fab class=\"fab-bg-color fab-bt\" #fab [ngStyle]=\"getOverlayStyle()\" (click)=\"fabParent()\" vertical=\"bottom\"\r\n    horizontal=\"end\">\r\n    <ion-fab-list #fabList style=\"width: 100%;\" side=\"top\">\r\n\r\n      <ion-row class=\"fab-row\">\r\n        <ion-col class=\"flex-container lbl\">\r\n          <ion-label class=\"fab-label\">Logout</ion-label>\r\n        </ion-col>\r\n        <ion-col size=\"2.5\">\r\n          <div class=\"logout_btn\">\r\n            <ion-icon name=\"log-out\" (click)=\"appLogout()\"></ion-icon>\r\n          </div>\r\n        </ion-col>\r\n      </ion-row>\r\n\r\n      <!-- <ion-row class=\"fab-row\">\r\n        <ion-col class=\"flex-container lbl\">\r\n          <ion-label class=\"fab-label\">Change Password</ion-label>\r\n        </ion-col>\r\n        <ion-col size=\"2.5\">\r\n          <div class=\"logout_btn\">\r\n            <ion-icon name=\"key\" (click)=\"goToChangePassword()\"></ion-icon>\r\n          </div>\r\n        </ion-col>\r\n      </ion-row>\r\n\r\n      <ion-row class=\"fab-row\">\r\n        <ion-col class=\"flex-container lbl\">\r\n          <ion-label class=\"fab-label\">Settings</ion-label>\r\n        </ion-col>\r\n        <ion-col size=\"2.5\">\r\n          <div class=\"logout_btn\">\r\n            <ion-icon name=\"key\" (click)=\"goToSettings()\"></ion-icon>\r\n          </div>\r\n        </ion-col>\r\n      </ion-row> -->\r\n\r\n    </ion-fab-list>\r\n  </ion-fab>\r\n\r\n</ion-content>";
