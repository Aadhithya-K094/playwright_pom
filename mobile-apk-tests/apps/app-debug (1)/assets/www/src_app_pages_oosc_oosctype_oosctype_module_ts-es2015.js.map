export default "<ion-header>\r\n  <ion-toolbar class=\"toolbar\">\r\n    <ion-buttons slot=\"start\" class=\"back-iconNew\" (click)=\"goBack()\">\r\n      <ion-icon name=\"arrow-back\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n    <ion-title class=\"pt-15\">\r\n      <div class=\"ion-text-wrap\">Dashboard</div>\r\n      <ion-row>\r\n        <ion-icon src=\"../assets/icons/user.svg\" class=\"user-icon\"> </ion-icon>\r\n        <div class=\"user-icon-label\">\r\n          <ion-label>{{teacher_id}}</ion-label>\r\n        </div>\r\n      </ion-row>\r\n    </ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n\r\n\r\n<ion-content padding class=\"graybackgrond\">\r\n  <div class=\"subDiv\">\r\n    <ion-row class=\"square-containers\">\r\n      <ion-col size=\"6\" *ngFor=\"let item of inchargeCategoryList\">\r\n        <ion-card class=\"card-menu\" (click)=\"goToInchargeTeacherList(item)\">\r\n          <div class=\"ion-margin-top ion-margin-bottom\" style=\"padding-left: 5px;\r\n      padding-right: 5px;\">\r\n            <img src=\"{{item.image}}\"><br />\r\n            <span style=\"font-weight: 500;\">{{item.incharge}}</span>\r\n          </div>\r\n        </ion-card>\r\n      </ion-col>\r\n    </ion-row>\r\n  </div>\r\n\r\n</ion-content>";
