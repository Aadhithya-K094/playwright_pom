export default "<ion-header>\r\n  <ion-toolbar class=\"toolbar\">\r\n    <ion-buttons slot=\"start\" class=\"back-iconNew\" (click)=\"onGoButton()\">\r\n      <ion-icon name=\"arrow-back\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n    <ion-title class=\"pt-15\">\r\n      <div class=\"ion-text-wrap\">Section</div>\r\n      <ion-row>\r\n        <ion-icon src=\"../assets/icons/user.svg\" style=\"width:24px;vertical-align: text-top;font-size: 17px;\"> </ion-icon>\r\n        <div style=\"font-size: 12px;padding-bottom: 4px;\">\r\n        <ion-label>{{UserName}}</ion-label>\r\n        </div>\r\n      </ion-row>\r\n    </ion-title>\r\n  </ion-toolbar>\r\n  \r\n</ion-header>\r\n\r\n<ion-content>\r\n\r\n  <div class=\"maindiv\">\r\n    <div>\r\n      <ion-row>\r\n        <ion-col size=\"4\" *ngFor=\"let sec of section\">\r\n          <ion-card class=\"classcard\" (click)=\"mainpage(sec)\">\r\n            <div style=\"text-align: center;\">\r\n              <ion-label class=\"classText\">{{sec}}</ion-label><br>\r\n              <ion-label  class=\"classNo\">Section</ion-label>\r\n            </div>\r\n          </ion-card>\r\n        </ion-col>\r\n  \r\n      </ion-row>\r\n    </div>\r\n  </div>\r\n\r\n</ion-content>\r\n";
