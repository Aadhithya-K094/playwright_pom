export default "<ion-header>\r\n  <ion-toolbar class=\"new-background-color\">\r\n      <ion-buttons slot=\"start\">\r\n        <ion-back-button></ion-back-button>\r\n      </ion-buttons>\r\n    <ion-title>Final Remarks</ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content padding>\r\n    <form [formGroup]=\"final_remarks_form\">\r\n        <ion-card padding>\r\n               <ion-label>Final Remarks</ion-label>\r\n               <ion-textarea class=\"text-area\" type=\"text\" placeholder=\"Remarks\" formControlName=\"final_remarks\"></ion-textarea><br/>          \r\n         </ion-card> \r\n      </form>\r\n      </ion-content>\r\n      \r\n\r\n<ion-footer>  \r\n      <ion-button color=\"primary\" expand=\"full\" (click)=\"onSubmit()\">Save </ion-button>  \r\n</ion-footer>\r\n";
