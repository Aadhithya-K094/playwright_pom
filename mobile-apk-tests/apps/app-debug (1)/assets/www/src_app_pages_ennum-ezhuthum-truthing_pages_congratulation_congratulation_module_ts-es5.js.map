export default "<ion-header>\r\n  <ion-toolbar>\r\n    <ion-title style=\"text-align: center;\">Ennum Ezhuthum Survey</ion-title>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content>\r\n  <div class=\"\">\r\n    <img src=\"/assets/images/ennum-ezhuthum/congratulation.gif\" class=\"congrats\"/>\r\n  </div>\r\n  <div class=\"thankyou\">\r\n    <div>\r\n      <img src=\"/assets/images/ennum-ezhuthum/Award.svg\" />\r\n      <h3>Congratulations!</h3>\r\n      <h5 *ngIf=\"this.level == 'L1' || this.level == 'L2'\">You have completed all assessments and met your target today</h5>\r\n      <h5 *ngIf=\"this.level == 'L3'\">Congratulations! You have completed the school visit</h5>\r\n      <ion-button class=\"btn\" (click)=\"theEnd()\">OK</ion-button>\r\n    </div>\r\n  </div>\r\n</ion-content>";
