export default "<ion-header>\r\n  <ion-toolbar>\r\n\r\n    <ion-title style=\"padding-left: 15px;\">\r\n      <div class=\"ion-text-wrap\">View Image</div>\r\n    </ion-title>\r\n\r\n    <ion-buttons slot=\"end\" class=\"pt-10\" style=\"zoom:1.5\">\r\n      <ion-icon class=\"back-icon\" name=\"close-outline\" (click)=\"closeModal()\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content  class=\"graybackgrond\">\r\n  <!-- <div>\r\n    <ion-item>\r\n      <!-- <ion-label position=\"floating\" color=\"primary\" style=\"font-size:16px\">Uploaded Image\r\n      </ion-label> -->\r\n    <!--  <div class=\"main\">\r\n      <img id=\"map\" src=\"{{imageURL}}\" alt=\"zoom it\" class=\"img image\">\r\n    </div>\r\n    </ion-item>\r\n  </div> -->\r\n\r\n  <ion-slides [options]=\"sliderOpt\" zoom>\r\n    <ion-slide>\r\n      <div class=\"swiper-zoom-container\">\r\n         <img  id=\"map\" src=\"{{imageURL}}\" />\r\n      </div>\r\n    </ion-slide>\r\n  </ion-slides>\r\n\r\n  <div id=\"navbar\" style=\"display: flex;justify-content: space-evenly;margin-top: 20px;\">\r\n    <button type=\"button\" (click)=\"zoomin()\"> Zoom In</button>\r\n    <button type=\"button\" (click)=\"zoomout()\"> Zoom Out</button>\r\n  </div>\r\n \r\n  <!-- <div id=\"navbar\">\r\n    <button type=\"button\" (click)=\"zoomin()\"> Zoom In</button>\r\n    <button type=\"button\" (click)=\"zoomout()\"> Zoom Out</button>\r\n    </div> -->\r\n\r\n</ion-content>";
