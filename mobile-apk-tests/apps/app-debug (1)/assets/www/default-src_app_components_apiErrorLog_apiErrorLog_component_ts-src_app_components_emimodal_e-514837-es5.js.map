export default "<ion-content>  \r\n  <div >\r\n    <ion-icon name=\"close-circle\" style=\"float: right;font-size:30px\" (click)=\"dismiss(ok)\"></ion-icon>\r\n  </div>\r\n  <div style=\"text-align: center;margin: 10px;\">     \r\n    <ion-text >\r\n      <div [innerHTML]=\"viewName.error\"></div>\r\n    </ion-text>\r\n  </div>\r\n  <div  class=\"d-flex justify-content-center\">      \r\n    <ion-button class=\"btn_modal-success\" (click)=\"dismiss('ok')\"\r\n      [ngClass]=\"{'ta-font': this.languageType == 'ta','fs-11': this.languageType == 'ta','modal-btn-w-50': this.languageType == 'ta'}\">\r\n      ok</ion-button>\r\n  </div>   \r\n</ion-content>";
