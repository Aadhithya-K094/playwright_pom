export default "<ion-content>\r\n  <div class=\"modalcontent-wrapper\">\r\n    <ion-text color=\"\" class=\"ion-text-center pt-2\">\r\n      <p>\r\n        <span\r\n          [ngClass]=\"{\r\n            'ta-font': this.languageType === 'ta',\r\n            'fs-9': this.languageType === 'ta'\r\n          }\"\r\n          ><b>Observer Remarks (if any)</b></span\r\n        >\r\n      </p>\r\n    </ion-text>\r\n   \r\n    <div class=\"text-center\">\r\n      \r\n        <textarea auto-grow=\"true\" placeholder=\"Enter your remarks (max 200 characters)\" class=\"text-area\"\r\n          (change)=\"getRemarks($event.target.value)\" rows=\"6\"></textarea>\r\n      \r\n     \r\n\r\n      <ion-button\r\n        style=\"color:#fff\"        \r\n        (click)=\"dismiss()\"\r\n        class=\"br-30\"\r\n        [ngClass]=\"{\r\n          'ta-font': this.languageType === 'ta',\r\n          'fs-12': this.languageType === 'ta'\r\n        }\"\r\n        ><b>{{ this.submit }}</b></ion-button>\r\n        <ion-text color=\"dark\" class=\"text-italic\">\r\n          <p class=\"fs-12 p-2\"><span>Note</span>:If no remarks, click on submit to proceed</p>\r\n        </ion-text>\r\n\r\n    </div>\r\n  </div>\r\n</ion-content>\r\n";
