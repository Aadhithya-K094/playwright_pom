export default "\r\n<div class=\"progress-outer position-relative\">\r\n    <div class=\"progress-inner\" [style.width.%]=\"progress\" >\r\n   \r\n    </div>\r\n    <p class=\"percentage-value\">{{progress}}% <span [ngClass]=\"{'ta-font': this.languageType === 'ta','fs-14': this.languageType === 'ta'}\">{{this.completed}}</span></p>\r\n</div>";
