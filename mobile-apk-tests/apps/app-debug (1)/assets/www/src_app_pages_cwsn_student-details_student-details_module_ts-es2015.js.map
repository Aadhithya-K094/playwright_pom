export default "<ion-header>\r\n  <ion-toolbar>\r\n    <ion-buttons slot=\"start\" class=\"pt-10\">\r\n      <ion-icon class=\"back-icon\" size=\"large\" name=\"arrow-back\" (click)=\"dismiss()\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n    <ion-title class=\"pt-15\"> \r\n      <div class=\"title\">\r\n        <div class=\"page-title\">View Questions</div>\r\n      </div>\r\n    </ion-title>\r\n    <ion-buttons slot=\"end\" class=\"pt-10\">\r\n      <ion-icon class=\"back-icon\" size=\"large\" name=\"sync\" (click)=\"onSync()\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n<ion-content class=\"graybackgrond\">\r\n  <ion-row class=\"mlr-10p\" *ngFor=\"let list of referQues;let i = index\">\r\n    <ion-col size=\"12\">\r\n      <ion-row class=\"rowStyle1\">\r\n        <ion-col size=\"10\">\r\n          <div class=\"p5\">\r\n            <ion-label>\r\n              {{i+1}}. {{list.Quest_text}}\r\n            </ion-label>\r\n          </div>\r\n        </ion-col>\r\n        <ion-row class=\"rowStyle2\">\r\n          <ion-col>\r\n            <ion-radio-group value = \"1\">\r\n              <ion-item lines=\"none\">\r\n                <ion-radio value=\"1\" class=\"red_radio\" ></ion-radio><span class=\"radioCon\">ஆம்</span>\r\n                <ion-radio value=\"2\" class=\"green_radio\"  ></ion-radio><span class=\"radioCon\">இல்லை</span>\r\n              </ion-item>\r\n            </ion-radio-group>\r\n          </ion-col>\r\n        </ion-row>\r\n      </ion-row>\r\n    </ion-col>\r\n  </ion-row>\r\n\r\n</ion-content>\r\n";
