export default "<ion-content>\r\n  <div class=\"content login-bg\">\r\n    <form name=\"form\" [formGroup]=\"form\" novalidate>\r\n      <div class=\"smart-container\">\r\n\r\n        <ion-item class=\"formLine light-back\" >\r\n          <ion-label position=\"floating\" color=\"primary\">User Name <span class=\"valid-astrict-clr\">*</span></ion-label>\r\n          <ion-input type=\"text\" formControlName=\"username\" autocomplete=\"off\" tabindex=\"1\">\r\n          </ion-input>\r\n        </ion-item>\r\n       \r\n        <ion-item class=\"formLine\">\r\n          <ion-label position=\"floating\" color=\"primary\">Password <span class=\"valid-astrict-clr\">*</span></ion-label>\r\n          <ion-input [type]=\"passwordType\" formControlName=\"password\" autocomplete=\"off\"\r\n            (keydown)=\"onKeydown($event)\">\r\n          </ion-input>\r\n          <ion-icon slot=\"end\" [name]=\"passwordIcon\" class=\"passwordIcon\" (click)=\"hideShowPassword()\"\r\n            style=\"float:right; margin-top: auto !important; \"></ion-icon>\r\n        </ion-item>\r\n       \r\n        <ion-button size=\"default\" class=\"loginButton\" (click)=\"login()\"> Login </ion-button>\r\n        <br />\r\n        <br />\r\n      </div>\r\n    </form>\r\n  </div>\r\n</ion-content>";
