export default "<ion-header>\r\n  <ion-toolbar class=\"pale-nave_blue\">\r\n    <ion-grid>\r\n        <ion-row>\r\n          <ion-col>\r\n              <ion-buttons slot=\"\">\r\n                  <ion-menu-button></ion-menu-button>\r\n                </ion-buttons>\r\n          </ion-col>\r\n          <ion-col class=\"\">\r\n              <ion-title class=\"ion-text-center fs-16\"><b>OBSERVATION <br>DISCUSSION</b>\r\n              </ion-title></ion-col>\r\n          <ion-col>\r\n              <app-notification></app-notification>\r\n          </ion-col>\r\n        </ion-row>\r\n      </ion-grid>\r\n  </ion-toolbar>\r\n</ion-header>\r\n<ion-content>    \r\n  <section class=\"p-0 h-100\">  \r\n    <h4 class=\"method-header-four text-white text-center m-0\">\r\n     <b> {{sectionData?.sec_name}} </b>       \r\n    </h4>\r\n    <div *ngIf=\"sectionData?.questionList.length\"\r\n        class=\"content-wrapper bg-dark-violet h-100\">\r\n    <app-questions [treeData]=\"sectionData?.questionList\" (valueChange)='displayCounter($event)'></app-questions>\r\n    </div>\r\n</section>\r\n  </ion-content>\r\n    <ion-footer style=\"height:50px;\">\r\n        <ion-tabs>\r\n          <ion-tab-bar slot=\"bottom\">\r\n            <ion-tab-button  class=\"btn-back\" (click)=\"goToBackPage()\">\r\n              <ion-label>BACK</ion-label>\r\n            </ion-tab-button>\r\n            <ion-tab-button class=\"btn-next\"  [routerLink]=\"['/tnvntabs/page-route/observation/updateObservation']\">\r\n              <ion-label>NEXT</ion-label>\r\n            </ion-tab-button>\r\n          </ion-tab-bar>\r\n        </ion-tabs>        \r\n      </ion-footer>\r\n\r\n\r\n";
