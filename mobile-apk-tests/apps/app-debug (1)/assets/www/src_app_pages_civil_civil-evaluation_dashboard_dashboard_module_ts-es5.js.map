export default "<ion-header>\r\n  <ion-toolbar>\r\n    <ion-buttons slot=\"start\" class=\"pt-10\">\r\n      <ion-icon class=\"back-icon\" size=\"large\" name=\"arrow-back\" (click)=\"goToBack()\">\r\n      </ion-icon>\r\n    </ion-buttons>\r\n    <!-- <ion-title class=\"pt-15\">HOD Inspection</ion-title> -->\r\n    <ion-title class=\"pt-15\">Civil Evaluation</ion-title>\r\n\r\n\r\n  </ion-toolbar>\r\n</ion-header>\r\n\r\n\r\n<ion-content class=\"secondary\">\r\n  <ion-row class=\"title\" style=\"margin:15px\" (click)=\"goToPrimary()\">\r\n    <ion-col size=\"12\" class=\"title-clr\" style=\"padding:15px\">\r\n      <ion-label>Primary Civil Evaluation</ion-label>\r\n    </ion-col>\r\n  </ion-row>\r\n\r\n  <ion-row class=\"title\"  style=\"margin:15px\" (click)=\"goToSecondary()\">\r\n    <ion-col size=\"12\" class=\"title-clr\"  style=\"padding:15px\">\r\n      <ion-label>Secondary Civil Evaluation</ion-label>\r\n    </ion-col>\r\n  </ion-row>\r\n</ion-content>\r\n";
