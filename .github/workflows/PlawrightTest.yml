name: Playwright testcase

on:
  workflow_dispatch:

jobs:
  automation-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Login test
        run: npx playwright test tests/e2e/Base_Testing/Login.spec.js --project=chromium
