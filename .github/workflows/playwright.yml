name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test --project=chromium
        continue-on-error: true

      # Generate Allure report (includes mail.html)
      - name: Generate Allure Report
        run: npx allure generate allure-results --clean -o allure-report

      # Send email with test results
      - name: Send Test Report Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Test Report - ${{ github.repository }} - ${{ github.ref_name }} - ${{ job.status }}"
          to: ${{ secrets.MAIL_RECIPIENTS }}
          from: "Playwright CI <${{ secrets.MAIL_USERNAME }}>"
          html_body: file://allure-report/export/mail.html
          attachments: allure-report/export/mail.html

      # Upload Allure report as artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      # Upload Playwright report as artifact
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
